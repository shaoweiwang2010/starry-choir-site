<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Starry SATB Choir</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#141414; --navy-deep:#000000; --parchment:#FBF8F1; --parchment-alt:#F5ECD6;
  --gold:#F5B942; --gold-deep:#D99A1E; --twilight:#2A2A2A; --ink:#1E2530; --ink-soft:#4B5563;
  --cream:#FBF8F1; --line:rgba(30,37,48,0.14); --line-on-navy:rgba(246,241,227,0.22);
  --font-display:'Fraunces', Georgia, 'Times New Roman', serif;
  --font-body:'Public Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --danger:#9A2D2D;
}
@media (prefers-color-scheme: dark){
  :root{
    --navy:#141414; --navy-deep:#000000; --parchment:#FBF8F1; --parchment-alt:#F5ECD6;
    --gold:#F5B942; --gold-deep:#D99A1E; --twilight:#2A2A2A; --ink:#1E2530; --ink-soft:#4B5563;
    --cream:#FBF8F1; --line:rgba(30,37,48,0.14); --line-on-navy:rgba(246,241,227,0.22);
  }
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
@media (prefers-reduced-motion: reduce){ html{scroll-behavior:auto;} *{animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important;} }
body{margin:0; background:var(--parchment); color:var(--ink); font-family:var(--font-body); font-size:16px; line-height:1.6; -webkit-font-smoothing:antialiased;}
img,svg{max-width:100%; display:block;}
a{color:inherit;}
h1,h2,h3{font-family:var(--font-display); font-weight:500; margin:0; color:inherit;}
.wrap{max-width:1080px; margin:0 auto; padding:0 28px;}
button{font-family:var(--font-body); cursor:pointer;}
:focus-visible{outline:2px solid var(--gold); outline-offset:2px;}

.site-nav{position:sticky; top:0; z-index:40; background:rgba(0,0,0,0.92); backdrop-filter:blur(6px); border-bottom:1px solid var(--line-on-navy);}
.site-nav .wrap{display:flex; align-items:center; justify-content:space-between; height:64px;}
.nav-brand{font-family:var(--font-display); font-weight:500; font-size:19px; color:var(--cream); letter-spacing:0.2px; text-decoration:none; display:flex; align-items:center; gap:10px;}
.nav-logo{width:34px; height:34px; border-radius:4px; display:block;}
.nav-links{display:flex; gap:28px; list-style:none; margin:0; padding:0;}
.nav-links a{color:rgba(246,241,227,0.82); text-decoration:none; font-size:14.5px; background:none; border:none; font-family:var(--font-body); cursor:pointer;}
.nav-links a:hover{color:var(--gold);}
.nav-toggle{display:none; background:none; border:none; color:var(--cream); font-size:24px; padding:6px;}
@media (max-width:720px){
  .nav-links{position:absolute; top:64px; left:0; right:0; background:var(--navy-deep); flex-direction:column; gap:0; padding:8px 0; display:none; border-bottom:1px solid var(--line-on-navy);}
  .nav-links.open{display:flex;}
  .nav-links a{display:block; padding:14px 28px; border-top:1px solid var(--line-on-navy);}
  .nav-toggle{display:block;}
}

.hero{position:relative; background:radial-gradient(ellipse at 20% 0%, #262626 0%, var(--navy) 55%, var(--navy-deep) 100%); color:var(--cream); overflow:hidden; padding:96px 0 110px;}
.hero .star{position:absolute; border-radius:50%; background:var(--cream); opacity:0.75; animation:twinkle 4.5s ease-in-out infinite;}
.hero .star.big{background:var(--gold); box-shadow:0 0 6px 1px rgba(245,185,66,0.5);}
@keyframes twinkle{0%,100%{opacity:0.25;}50%{opacity:0.9;}}
.hero-inner{position:relative; z-index:2; max-width:640px;}
.hero-logo{width:104px; height:104px; border-radius:6px; margin-bottom:28px; display:block;}
.eyebrow-plain{font-family:var(--font-body); font-size:14.5px; color:var(--gold); margin:0 0 18px;}
.hero h1{font-size:clamp(40px,6vw,64px); line-height:1.05; margin-bottom:20px; font-style:italic;}
.hero p.lede{font-size:19px; color:rgba(246,241,227,0.86); max-width:480px; margin:0 0 34px;}
.hero-ctas{display:flex; gap:28px; align-items:center; flex-wrap:wrap;}
.btn{display:inline-block; padding:13px 26px; border-radius:3px; font-size:15px; font-weight:600; text-decoration:none; border:1px solid transparent; background:none;}
.btn-gold{background:var(--gold); color:var(--navy-deep);}
.btn-gold:hover{background:var(--gold-deep);}
.text-link{color:var(--cream); text-decoration:underline; text-underline-offset:4px; text-decoration-color:rgba(246,241,227,0.5); font-size:15px; background:none; border:none; padding:0; font-family:var(--font-body); cursor:pointer;}
.text-link:hover{text-decoration-color:var(--gold); color:var(--gold);}

section{padding:88px 0;}
.section-head{max-width:560px; margin:0 0 44px;}
.section-head h2{font-size:clamp(28px,3.4vw,36px); margin-bottom:14px;}
.section-head p{color:var(--ink-soft); font-size:16.5px; margin:0;}
.on-navy{background:var(--navy); color:var(--cream);}
.on-navy .section-head p{color:rgba(246,241,227,0.78);}

.about-grid{display:grid; grid-template-columns:1.3fr 1fr; gap:60px; align-items:start;}
.about-grid p{margin:0 0 18px; color:var(--ink-soft); font-size:16.5px; max-width:52ch;}
.fact-box{border:1px solid var(--line); border-radius:2px; padding:26px 28px;}
.fact-box dl{margin:0; display:grid; grid-template-columns:auto 1fr; gap:12px 18px;}
.fact-box dt{font-size:13.5px; color:var(--ink-soft); font-weight:600; white-space:nowrap; padding-top:1px;}
.fact-box dd{margin:0; font-size:15px;}
@media (max-width:820px){.about-grid{grid-template-columns:1fr;}}

.voices-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:1px; background:var(--line-on-navy); border:1px solid var(--line-on-navy);}
.voice-card{background:var(--navy); padding:34px 24px;}
.voice-letter{font-family:var(--font-display); font-style:italic; font-size:44px; color:var(--gold); margin-bottom:10px;}
.voice-card h3{font-size:18px; color:var(--cream); margin-bottom:8px; font-weight:500;}
.voice-card p{font-size:14.5px; color:rgba(246,241,227,0.72); margin:0;}
@media (max-width:820px){.voices-grid{grid-template-columns:repeat(2,1fr);}}

.updates-head{display:flex; justify-content:space-between; align-items:flex-end; gap:20px; flex-wrap:wrap;}
.pinned-grid{display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-bottom:52px;}
@media (max-width:720px){.pinned-grid{grid-template-columns:1fr;}}
.pinned-card{background:var(--parchment-alt); border-left:3px solid var(--gold); padding:22px 24px;}
.pinned-card .cat{font-size:12.5px; color:var(--gold-deep); font-weight:600; margin-bottom:6px;}
.pinned-card h3{font-size:19px; margin-bottom:8px;}
.pinned-card .body-text{color:var(--ink-soft); font-size:15px; margin:0;}
.timeline{border-left:2px solid var(--line); margin-left:6px; padding-left:32px;}
.tl-item{position:relative; padding-bottom:36px;}
.tl-item:last-child{padding-bottom:0;}
.tl-item::before{content:""; position:absolute; left:-38px; top:6px; width:11px; height:11px; border-radius:50%; background:var(--gold); border:2px solid var(--parchment);}
.tl-date{font-size:13px; color:var(--ink-soft); margin-bottom:4px;}
.tl-cat{display:inline-block; font-size:11.5px; font-weight:600; color:var(--twilight); border:1px solid var(--twilight); border-radius:12px; padding:1px 10px; margin-left:8px; vertical-align:1px;}
.tl-item h3{font-size:19px; margin-bottom:8px;}
.tl-item .body-text{color:var(--ink-soft); font-size:15px; margin:0; max-width:60ch;}
.empty-state{border:1px dashed var(--line); border-radius:2px; padding:38px 30px; text-align:center; color:var(--ink-soft);}
.empty-state h3{color:var(--ink); margin-bottom:8px; font-size:19px;}

.join-grid{display:grid; grid-template-columns:1fr 1.15fr; gap:56px;}
@media (max-width:820px){.join-grid{grid-template-columns:1fr;}}
.form-field{margin-bottom:18px;}
.form-field label{display:block; font-size:13.5px; margin-bottom:6px; color:rgba(246,241,227,0.82);}
.form-field input, .form-field select, .form-field textarea{width:100%; padding:11px 13px; background:rgba(246,241,227,0.06); border:1px solid var(--line-on-navy); border-radius:2px; color:var(--cream); font-family:var(--font-body); font-size:15px;}
.form-field input::placeholder, .form-field textarea::placeholder{color:rgba(246,241,227,0.4);}
.form-field select option{color:#111;}
.form-row2{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
.form-error{color:#F2A9A9; font-size:13px; margin-top:6px;}
.form-note{font-size:13.5px; color:rgba(246,241,227,0.6); margin-top:16px;}

.members-section .form-field label{color:var(--ink-soft);}
.members-section .form-field input{background:#fff; color:var(--ink); border:1px solid var(--line);}
.members-panel{max-width:420px;}
.member-card{background:var(--parchment-alt); border-radius:2px; padding:20px 22px; margin-bottom:14px;}
.member-card h3{font-size:17px; margin-bottom:6px;}
.member-card p{margin:0; color:var(--ink-soft); font-size:14.5px;}
.member-card a.dl{display:inline-block; margin-top:10px; font-size:14px; color:var(--gold-deep); text-decoration:underline; text-underline-offset:3px;}
.member-topbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:24px; flex-wrap:wrap; gap:12px;}
.member-topbar .who{font-size:14px; color:var(--ink-soft);}
.link-btn{background:none; border:none; color:var(--gold-deep); text-decoration:underline; text-underline-offset:3px; font-size:14px; font-family:var(--font-body); cursor:pointer; padding:0;}

footer{background:var(--navy-deep); color:rgba(246,241,227,0.7); padding:44px 0; font-size:14px;}
footer .wrap{display:flex; justify-content:space-between; flex-wrap:wrap; gap:12px; align-items:center;}
footer a{color:rgba(246,241,227,0.85); text-decoration:underline; text-underline-offset:3px;}
.sr-only{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap;}
</style>
</head>
<body>
<div id="app"></div>
<script src="shared.js"></script>
<script>
(function(){
"use strict";
var uiState = { mobileNavOpen:false, memberError:'' };
var state = { updates: [] };
var loadStatus = "loading";
var memberAuth = null;
var memberResources = null;
var memberLoadStatus = "idle";

try{
  var savedAuth = sessionStorage.getItem('choir_auth');
  if(savedAuth) memberAuth = JSON.parse(savedAuth);
}catch(e){ memberAuth = null; }

var esc = ChoirUtil.escapeHtml, nl2br = ChoirUtil.nl2br, formatDate = ChoirUtil.formatDate;

function sortedUpdates(){
  var arr = (state.updates||[]).slice();
  arr.sort(function(a,b){ return new Date(b.date) - new Date(a.date); });
  return arr;
}

function nav(){
  return ''+
  '<nav class="site-nav"><div class="wrap">'+
    '<a class="nav-brand" href="#top"><img class="nav-logo" src="logo.png" alt=""><span>Starry SATB Choir</span></a>'+
    '<button class="nav-toggle" data-action="toggle-nav" aria-label="Toggle menu">&#9776;</button>'+
    '<ul class="nav-links'+(uiState.mobileNavOpen?' open':'')+'">'+
      '<li><a href="#about">About</a></li>'+
      '<li><a href="#voices">Voice parts</a></li>'+
      '<li><a href="#updates">Updates</a></li>'+
      '<li><a href="#members">Member area</a></li>'+
      '<li><a href="#join">Join us</a></li>'+
      '<li><a href="#contact">Contact</a></li>'+
    '</ul>'+
  '</div></nav>';
}

function heroStars(){
  var out = '';
  var positions = [[6,14,1],[14,58,0],[22,30,1],[9,80,0],[30,90,0],[40,10,0],[46,45,1],[55,72,0],[62,20,0],[70,88,1],[76,50,0],[84,8,0],[88,65,0],[18,4,0],[35,66,0],[50,3,1],[65,40,0],[80,30,0],[12,95,0],[58,95,1]];
  for(var i=0;i<positions.length;i++){
    var p = positions[i], big = p[2]===1;
    var size = big ? (2.5+ (i%3)) : (1+(i%2));
    out += '<span class="star'+(big?' big':'')+'" style="top:'+p[0]+'%; left:'+p[1]+'%; width:'+size+'px; height:'+size+'px; animation-delay:'+(i*0.3)+'s;"></span>';
  }
  return out;
}

function hero(){
  return ''+
  '<header class="hero" id="top">'+
    heroStars()+
    '<div class="wrap"><div class="hero-inner">'+
      '<img class="hero-logo" src="logo.png" alt="Starry Choir logo">'+
      '<p class="eyebrow-plain">A community choir, ages 10 to 70</p>'+
      '<h1>Starry SATB Choir</h1>'+
      '<p class="lede">We gather to sing four-part harmony together, welcoming voices at every stage &mdash; from first-time singers to seasoned choristers.</p>'+
      '<div class="hero-ctas"><a class="btn btn-gold" href="#join">Join the choir</a><a class="text-link" href="#updates">See recent updates</a></div>'+
    '</div></div>'+
  '</header>';
}

function about(){
  return ''+
  '<section id="about"><div class="wrap">'+
    '<div class="about-grid">'+
      '<div>'+
        '<div class="section-head" style="margin-bottom:22px;"><h2>About the choir</h2></div>'+
        '<p>Starry SATB Choir is a community choir open to singers of every background and ability, ages 10 to 70. We rehearse together weekly and perform a mix of choral repertoire across the year, from classical works to contemporary arrangements.</p>'+
        '<p>No audition is required to join a rehearsal. If you can carry a tune and enjoy singing with others, there is a place for you here &mdash; whatever your experience level.</p>'+
      '</div>'+
      '<div class="fact-box"><dl>'+
        '<dt>Voice parts</dt><dd>Soprano, alto, tenor, bass</dd>'+
        '<dt>Ages</dt><dd>10 to 70</dd>'+
        '<dt>Experience</dt><dd>All levels welcome, no audition</dd>'+
        '<dt>Contact</dt><dd><a style="color:var(--ink); text-decoration:underline; text-underline-offset:3px;" href="mailto:starrysatbchoir@gmail.com">starrysatbchoir@gmail.com</a></dd>'+
      '</dl></div>'+
    '</div>'+
  '</div></section>';
}

function voices(){
  var parts = [
    ['S','Soprano','The highest voice part, carrying the melodic line in much of our repertoire.'],
    ['A','Alto','The lower female (or high male) part, filling out the harmony beneath the soprano line.'],
    ['T','Tenor','The higher male voice part, often weaving countermelodies through a piece.'],
    ['B','Bass','The foundation of the chord, anchoring the harmony with the lowest line.']
  ];
  var cards = parts.map(function(p){
    return '<div class="voice-card"><div class="voice-letter">'+p[0]+'</div><h3>'+p[1]+'</h3><p>'+p[2]+'</p></div>';
  }).join('');
  return ''+
  '<section id="voices" class="on-navy"><div class="wrap">'+
    '<div class="section-head"><h2>Four parts, one sound</h2><p>Every voice matters. Not sure where you fit? Come to a rehearsal and we will help you find your part.</p></div>'+
    '<div class="voices-grid">'+cards+'</div>'+
  '</div></section>';
}

function updateCard(u, pinned){
  if(pinned){
    return '<div class="pinned-card">'+
      '<p class="cat">'+esc(u.category)+' &middot; pinned</p>'+
      '<h3>'+esc(u.title)+'</h3>'+
      '<p class="body-text">'+nl2br(u.body)+'</p>'+
    '</div>';
  }
  return '<div class="tl-item">'+
    '<p class="tl-date">'+formatDate(u.date)+'<span class="tl-cat">'+esc(u.category)+'</span></p>'+
    '<h3>'+esc(u.title)+'</h3>'+
    '<p class="body-text">'+nl2br(u.body)+'</p>'+
  '</div>';
}

function updates(){
  var all = sortedUpdates();
  var pinned = all.filter(function(u){ return u.pinned; });
  var rest = all.filter(function(u){ return !u.pinned; });
  var pinnedHtml = pinned.length ? ('<div class="pinned-grid">'+pinned.map(function(u){return updateCard(u,true);}).join('')+'</div>') : '';
  var restHtml;
  if(loadStatus === 'loading'){
    restHtml = '<div class="empty-state"><h3>Loading updates&hellip;</h3></div>';
  } else if(loadStatus === 'error'){
    restHtml = '<div class="empty-state"><h3>Couldn\'t load updates.json</h3><p>Make sure updates.json is deployed alongside this page.</p></div>';
  } else if(rest.length){
    restHtml = '<div class="timeline">'+rest.map(function(u){return updateCard(u,false);}).join('')+'</div>';
  } else if(!pinned.length){
    restHtml = '<div class="empty-state"><h3>No updates yet</h3><p>Check back soon for rehearsal times, concerts and choir news.</p></div>';
  } else {
    restHtml = '';
  }
  return ''+
  '<section id="updates"><div class="wrap">'+
    '<div class="updates-head section-head" style="margin-bottom:36px;"><div><h2>Recent updates</h2><p>Rehearsal changes, upcoming concerts and choir news.</p></div></div>'+
    pinnedHtml+restHtml+
  '</div></section>';
}

function memberLoginForm(){
  return ''+
  '<div class="members-panel">'+
    '<div class="form-field"><label for="mem-user">Username</label><input id="mem-user" type="text" autocomplete="username"></div>'+
    '<div class="form-field"><label for="mem-pass">Password</label><input id="mem-pass" type="password" autocomplete="current-password"></div>'+
    (uiState.memberError ? '<p class="form-error" style="color:var(--danger);">'+esc(uiState.memberError)+'</p>' : '')+
    '<button class="btn btn-gold" data-action="member-login">Log in</button>'+
    '<p style="font-size:13.5px; color:var(--ink-soft); margin-top:14px;">Not a member yet? <a style="color:var(--ink); text-decoration:underline;" href="#join">Fill in the join form</a> and we will set up your login.</p>'+
  '</div>';
}

function resourceCard(r){
  var link = r.fileUrl ? '<a class="dl" href="'+esc(r.fileUrl)+'" target="_blank" rel="noopener">Open / download</a>' : '';
  return '<div class="member-card"><h3>'+esc(r.title)+'</h3><p>'+nl2br(r.description||'')+'</p>'+link+'</div>';
}

function memberArea(){
  var body;
  if(!memberAuth){
    body = memberLoginForm();
  } else if(memberLoadStatus === 'loading'){
    body = '<div class="empty-state"><h3>Loading materials&hellip;</h3></div>';
  } else if(memberLoadStatus === 'error'){
    body = '<div class="empty-state"><h3>Couldn\'t load member materials</h3><p>Try refreshing the page.</p></div>';
  } else {
    var list = (memberResources && memberResources.resources) || [];
    body = list.length
      ? list.map(resourceCard).join('')
      : '<div class="empty-state"><h3>No materials yet</h3><p>Check back once the admin uploads something.</p></div>';
  }
  var topbar = memberAuth
    ? '<div class="member-topbar"><span class="who">Signed in as '+esc(memberAuth.displayName||memberAuth.username)+'</span><button class="link-btn" data-action="member-logout">Log out</button></div>'
    : '';
  return ''+
  '<section id="members" class="members-section"><div class="wrap">'+
    '<div class="section-head"><h2>Member area</h2><p>Sheet music, rehearsal recordings and other member-only materials.</p></div>'+
    topbar+body+
  '</div></section>';
}

function join(){
  return ''+
  '<section id="join" class="on-navy"><div class="wrap">'+
    '<div class="join-grid">'+
      '<div><div class="section-head" style="margin-bottom:18px;"><h2>Sing with us</h2><p>Fill in the form and it will open a pre-filled email to send us &mdash; we will get back to you with rehearsal details.</p></div></div>'+
      '<div>'+
        '<div class="form-row2">'+
          '<div class="form-field"><label for="f-name">Full name</label><input id="f-name" type="text" placeholder="Jordan Lee"></div>'+
          '<div class="form-field"><label for="f-age">Age</label><input id="f-age" type="number" min="10" max="100" placeholder="34"></div>'+
        '</div>'+
        '<div class="form-row2">'+
          '<div class="form-field"><label for="f-email">Email</label><input id="f-email" type="email" placeholder="name@email.com"></div>'+
          '<div class="form-field"><label for="f-phone">Phone (optional)</label><input id="f-phone" type="tel" placeholder="(204) 555-0100"></div>'+
        '</div>'+
        '<div class="form-row2">'+
          '<div class="form-field"><label for="f-voice">Voice part</label><select id="f-voice"><option value="Not sure">Not sure yet</option><option>Soprano</option><option>Alto</option><option>Tenor</option><option>Bass</option></select></div>'+
          '<div class="form-field"><label for="f-exp">Experience</label><select id="f-exp"><option>New to singing</option><option>Some experience</option><option>Experienced</option></select></div>'+
        '</div>'+
        '<div class="form-field"><label for="f-msg">Message (optional)</label><textarea id="f-msg" rows="3" placeholder="Anything you would like us to know"></textarea></div>'+
        '<div id="form-error-slot"></div>'+
        '<button class="btn btn-gold" data-action="submit-registration" style="border:none; margin-top:6px;">Send registration</button>'+
        '<p class="form-note">This opens your email app with a message addressed to starrysatbchoir@gmail.com &mdash; review it and hit send there.</p>'+
      '</div>'+
    '</div>'+
  '</div></section>';
}

function footer(){
  return ''+
  '<footer id="contact"><div class="wrap">'+
    '<div>Starry SATB Choir &middot; <a href="mailto:starrysatbchoir@gmail.com">starrysatbchoir@gmail.com</a></div>'+
    '<div>&copy; '+new Date().getFullYear()+' Starry SATB Choir</div>'+
  '</div></footer>';
}

function render(){
  document.getElementById('app').innerHTML = nav()+hero()+about()+voices()+updates()+memberArea()+join()+footer();
}

async function loadMemberResources(){
  memberLoadStatus = 'loading';
  render();
  try{
    var res = await fetch('./resources.json', {cache:'no-store'});
    if(!res.ok) throw new Error('HTTP '+res.status);
    var data = await res.json();
    memberResources = (data && typeof data==='object') ? data : {resources:[]};
    if(!Array.isArray(memberResources.resources)) memberResources.resources = [];
    memberLoadStatus = 'ok';
  }catch(e){
    console.error('Could not load resources.json', e);
    memberLoadStatus = 'error';
  }
  render();
}

async function handleMemberLogin(){
  var username = document.getElementById('mem-user').value.trim();
  var password = document.getElementById('mem-pass').value;
  uiState.memberError = '';
  if(!username || !password){
    uiState.memberError = 'Enter your username and password.';
    render();
    return;
  }
  try{
    var res = await fetch('./users.json', {cache:'no-store'});
    var data = await res.json();
    var user = (data.users||[]).filter(function(u){ return u.username === username; })[0];
    if(!user){ uiState.memberError = 'Incorrect username or password.'; render(); return; }
    var hash = await ChoirAuth.hashPassword(password, user.salt);
    if(hash !== user.hash){ uiState.memberError = 'Incorrect username or password.'; render(); return; }
    memberAuth = { username: user.username, role: user.role, displayName: user.displayName || user.username };
    sessionStorage.setItem('choir_auth', JSON.stringify(memberAuth));
    render();
    loadMemberResources();
  }catch(e){
    uiState.memberError = 'Could not check login right now. Try again shortly.';
    render();
  }
}

function memberLogout(){
  memberAuth = null;
  memberResources = null;
  memberLoadStatus = 'idle';
  sessionStorage.removeItem('choir_auth');
  render();
}

function submitRegistration(){
  var slot = document.getElementById('form-error-slot');
  var name = document.getElementById('f-name').value.trim();
  var email = document.getElementById('f-email').value.trim();
  var age = document.getElementById('f-age').value.trim();
  var phone = document.getElementById('f-phone').value.trim();
  var voice = document.getElementById('f-voice').value;
  var exp = document.getElementById('f-exp').value;
  var msg = document.getElementById('f-msg').value.trim();
  var emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
  if(!name || !emailOk){
    slot.innerHTML = '<p class="form-error">Enter your name and a valid email to continue.</p>';
    return;
  }
  slot.innerHTML = '';
  var bodyLines = ['New registration for Starry SATB Choir','','Name: '+name,'Age: '+(age||'-'),'Email: '+email,'Phone: '+(phone||'-'),'Voice part: '+voice,'Experience: '+exp,'Message: '+(msg||'-')];
  var mailto = 'mailto:starrysatbchoir@gmail.com?subject='+encodeURIComponent('Choir registration: '+name)+'&body='+encodeURIComponent(bodyLines.join('\n'));
  window.location.href = mailto;
}

document.addEventListener('click', function(ev){
  var el = ev.target.closest('[data-action]');
  if(!el) return;
  var action = el.getAttribute('data-action');
  if(action==='toggle-nav'){ uiState.mobileNavOpen = !uiState.mobileNavOpen; render(); }
  else if(action==='submit-registration'){ submitRegistration(); }
  else if(action==='member-login'){ handleMemberLogin(); }
  else if(action==='member-logout'){ memberLogout(); }
});

render();

fetch('./updates.json', {cache:'no-store'})
  .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
  .then(function(data){
    state = (data && typeof data === 'object') ? data : {updates:[]};
    if(!Array.isArray(state.updates)) state.updates = [];
    loadStatus = 'ok';
    render();
  })
  .catch(function(err){
    console.error('Could not load updates.json', err);
    loadStatus = 'error';
    render();
  });

if(memberAuth){ loadMemberResources(); }
})();
</script>
</body>
</html>
